[project]
name = "saakshi"
version = "0.1.0"
description = "SAAKSHI - a read-only forensic and accountability layer over India's public spending data. Hackathon prototype (CAG-retrospective demo)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# The demo runs on the Python standard library ONLY.
# A judge can `git clone && python run_demo.py` with no network and no pip install.
# The production dependencies described in PLAN.md (duckdb, kuzu, imagehash,
# rasterio, lightgbm, splink, ...) are intentionally NOT required to run the demo.
dependencies = []

[project.optional-dependencies]
# Production stack from PLAN.md. Not needed for the retrospective demo.
prod = [
  "duckdb",
  "kuzu",
  "polars",
  "imagehash",
  "pillow",
  "exifread",
  "pystac-client",
  "rasterio",
  "lightgbm",
  "scikit-learn",
  "splink",
  "rapidfuzz",
  "fastapi",
  "uvicorn[standard]",
  "jinja2",
]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saakshi"]
